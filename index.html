    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Cleanly satisfy Vite HMR WebSocket in cloud container environments where HMR is disabled
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            var MockWebSocket = function(url, protocols) {
              var isViteHMR = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
              if (isViteHMR) {
                var listeners = {};
                var mock = {
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  readyState: 1,
                  protocol: 'vite-hmr',
                  url: String(url),
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                  },
                  removeEventListener: function(type, fn) {
                    if (!listeners[type]) return;
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  },
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() {
                    mock.readyState = 3;
                  }
                };
                return mock;
              }
              return new OrigWebSocket(url, protocols);
            };
            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;
            MockWebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket = MockWebSocket;
          }

          window.addEventListener('unhandledrejection', function(e) {
            var r = e && e.reason;
            var msg = (r && (r.message || (typeof r === 'string' ? r : ''))) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
              e.preventDefault();
              e.stopPropagation();
            }
          }, true);

          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) {
              return (a && a.message) || (typeof a === 'object' ? '' : String(a));
            }).join(' ');
            if (text.indexOf('websocket') !== -1 || text.indexOf('WebSocket') !== -1) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };
        }
      })();
    </script>
