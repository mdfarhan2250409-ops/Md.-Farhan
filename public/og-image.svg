<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A1A" />
      <stop offset="50%" stop-color="#0B1D51" />
      <stop offset="100%" stop-color="#020612" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#5DE2E7" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#5DE2E7" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="600" cy="220" r="160" fill="#5DE2E7" fill-opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="1050" cy="150" r="120" fill="#0088FF" fill-opacity="0.15" filter="url(#ogGlow)" />

  <!-- Logo Emblem -->
  <g transform="translate(530, 80)">
    <circle cx="70" cy="70" r="65" fill="#060B1E" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="70" cy="70" r="54" stroke="#5DE2E7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 3" />
    <text x="70" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="2">OTL</text>
  </g>

  <!-- Badge Tag -->
  <rect x="440" y="250" width="320" height="34" rx="17" fill="#5DE2E7" fill-opacity="0.15" stroke="#5DE2E7" stroke-width="1" />
  <text x="600" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#5DE2E7" text-anchor="middle" letter-spacing="3">OFFICIAL DIGITAL PLATFORM</text>

  <!-- Brand Title H1 -->
  <text x="600" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    Online Task Lab (OTL)
  </text>

  <!-- Subtitle -->
  <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Online Tasks, Curated Digital Opportunities &amp; Verified Resources
  </text>

  <!-- Pillars / Categories -->
  <g transform="translate(240, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#0B1D51" stroke="#5DE2E7" stroke-width="1" stroke-opacity="0.4" />
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Mobile Apps</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="160" height="42" rx="10" fill="#0B1D51" stroke="#5DE2E7" stroke-width="1" stroke-opacity="0.4" />
    <text x="265" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Landing Pages</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="160" height="42" rx="10" fill="#0B1D51" stroke="#5DE2E7" stroke-width="1" stroke-opacity="0.4" />
    <text x="450" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">AI Prompts</text>

    <!-- Pill 4 -->
    <rect x="555" y="0" width="165" height="42" rx="10" fill="#0B1D51" stroke="#5DE2E7" stroke-width="1" stroke-opacity="0.4" />
    <text x="637" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Lightroom Presets</text>
  </g>

  <!-- Canonical URL Domain -->
  <text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#5DE2E7" text-anchor="middle" letter-spacing="1">
    https://onlinetasklab.freedev.app/
  </text>
</svg>
